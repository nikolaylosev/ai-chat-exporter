name: Bug report
description: Something does not export, or exports wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste the content of your chats, file names, account details, tokens or cookies here.** This issue is public. Describe the problem in general terms, or make a test chat that shows it.
  - type: dropdown
    id: platform
    attributes:
      label: Service
      options: [Claude, Gemini, Grok, ChatGPT, Several, Not related to a service]
    validations:
      required: true
  - type: dropdown
    id: what
    attributes:
      label: What were you exporting?
      options:
        - The current chat (button or shortcut)
        - Selected chats from the export page
        - A project or a notebook
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: See chrome://extensions
      placeholder: 0.2.12
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version and operating system
      placeholder: Chrome 141, macOS 26
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a chat with an uploaded PDF on …
        2. Click "Save this chat"
        3. …
  - type: textarea
    id: report
    attributes:
      label: Error message or report
      description: The message in the popup or the panel, or the lines from `_reports/export-report-….md`. Remove chat titles and file names first.
      render: text
